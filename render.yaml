services:
  - type: web
    name: xon-music-bot
    env: python
    region: oregon
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "python main_render.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BOT_PREFIX
        value: "!"
      - key: DISCORD_TOKEN
        sync: false
      # BUG-07 FIX: Explicit URL for anti-sleep keep-alive ping
      - key: RENDER_EXTERNAL_URL
        value: "https://xon-music-bot.onrender.com"
